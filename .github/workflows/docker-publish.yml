name: Build, Test and Publish Student Result Prediction

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: student-result-prediction
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: student-result-prediction:ci

      - name: Start test container
        run: |
          docker run -d --name student-result-ci -p 8000:8000 student-result-prediction:ci
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs student-result-ci
          exit 1

      - name: Test prediction endpoint
        run: |
          curl --fail --silent --show-error             -H "Content-Type: application/json"             -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}'             http://localhost:8000/predict

      - name: Stop test container
        if: always()
        run: docker rm -f student-result-ci || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long,prefix=sha-

      - name: Publish tested image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
